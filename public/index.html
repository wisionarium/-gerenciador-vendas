<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>SellDay — Controle de Vendas</title>
  <meta name="theme-color" content="#0b3b2c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/icons/logo.png">
  <link rel="apple-touch-icon" href="/icons/logo.png">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Yeseva+One&family=Open+Sans:ital,wght@1,400&display=swap" rel="stylesheet">
</head>
<body>
  <div id="splash">
    <div class="splash-inner">
      <div class="splash-logo" id="splashLogo"><span class="s-sell">Sell</span><span class="s-day">DAY.</span></div>
      <div class="splash-tag"><span class="tg" style="--d:.45s">Sua venda.</span> <span class="tg" style="--d:.75s">Seu progresso.</span> <span class="tg" style="--d:1.05s">Seu dia.</span></div>
    </div>
    <div class="splash-circle" id="splashCircle"></div>
  </div>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo"><img src="/icons/logo.png" alt="SellDay"></div>
      <div>
        <div class="brand-name">SellDay</div>
        <div class="brand-sub">Controle de desempenho</div>
      </div>
      <div class="spacer"></div>
      <span id="userBadge" class="muted" style="font-size:13px"></span>
      <button id="logoutBtn" class="btn btn-ghost" style="display:none">Sair</button>
    </div>
  </header>

  <div id="alertBox"></div>
  <main id="app" class="container"></main>

  <nav id="bottomNav" class="bottomnav" style="display:none"></nav>
  <div id="modalRoot"></div>

  <script src="/js/app.js" defer></script>
</body>
</html>
